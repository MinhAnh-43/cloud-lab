services:
  backend:
    build: ./mern-demo/server
    container_name: mern-backend
    network_mode: host
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: >
      sh -c "pkill -f 'server.js' || true; exec node server.js"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb+srv://Anh:anh123@cluster0.nw18gtl.mongodb.net/cloud_lab?appName=Cluster0
    restart: unless-stopped
  frontend:
    build: ./mern-demo/client
    container_name: mern-frontend
    ports:  
      - "3000:3000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - backend
