services:
  backend:
    image: minhanh43/mern-backend:1.0
    container_name: mern-backend-hub
    network_mode: host
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: >
      sh -c "pkill -f 'server.js' || true; exec node server.js"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb+srv://Anh:anh123@cluster0.nw18gtl.mongodb.net/cloud_lab?appName=Cluster0
    restart: unless-stopped

  frontend:
    image: minhanh43/mern-frontend:2.0
    container_name: mern-frontend-hub
    ports:
      - "3000:3000"
    depends_on:
      - backend
